<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hey</title>
    <link rel="shortcut icon" href="logoSite.svg" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
	<style>
	@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap');
	body {
		background-color: black;
		width: 100%;
		height: 100vh;
		display: flex;
		justify-content: center;
		align-items: center;
		margin: 0;
	}
	
	html, body {
		height: 100%; /* Assure que le body couvre toute la hauteur de l'écran */
		touch-action: none; /* Empêche les interactions tactiles comme le glissement */
	}

	main {
		position: relative; /* Nécessaire pour le positionnement absolu de estHover */
		width: 11rem;
		overflow: hidden;

		display: flex;
		flex-direction: row;
		flex-wrap: nowrap;
		justify-content: space-between;

		z-index: 4;
		border-radius: 2rem;
		border-right: 0.15rem solid #2f2f2f00;
		transition: all 0.5s cubic-bezier(0.495, 0.385, 0.005, 1.075);
	}

	main:hover {
		width: 25rem;
		border-radius: 2.5rem;
		border-right: 0.15rem solid #2F2F2F90;
	}

	@media screen and (max-width: 600px) {
		main {
			width: 25rem;
			border-right: 0.15rem solid #2F2F2F90;

		}
	}

	.aHover {
        z-index: 2;
        width: 8rem;
        overflow: hidden; 

		font-size: 3rem;
		text-decoration: none;
		padding: 2rem;
		border: 0.15rem solid #2F2F2F00;
		border-radius: 2rem;
		box-shadow: 0px 0px 1rem 1rem rgba(0,0,0,1) inset;
		background-color: black;
		transition: all 0.5s cubic-bezier(0.495, 0.385, 0.005, 1.075) ;
	}
	main:hover .aHover{
		border-radius: 2.5rem;
		border: 0.15rem solid #2F2F2F90;
		box-shadow: 0px 0px 3rem 1rem rgba(0,0,0,1) inset;
		background-color: #2F2F2F90;
	}

    .estHover{
        opacity: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        align-items: flex-start;

        position: absolute;
        height: 100%;
        right: 0;

        padding-right: 0rem;
        transition: all 0.5s cubic-bezier(0.495, 0.385, 0.005, 1.075) ;
    }
	
	@media screen and (max-width: 600px) {
		.estHover {
			opacity: 1;
		    padding-right: 3rem;
		}
	}

    main:hover .estHover{
        padding-right: 3rem;
        opacity: 1;
    }
	
	h5 {
		margin: 0;
        text-align: center;
        white-space: nowrap;
        color: #fff;
        font-family: 'IBM Plex Sans', sans-serif;
	}

    h4 {
        margin: 0;
        text-align: center;
		text-align: right;
        white-space: nowrap;
        color: #fff;
        font-family: 'IBM Plex Sans', sans-serif;
    }

    a {
		font-weight: 200;
		text-decoration: underline white;
    }

    </style>
</head>

<body>
    <main>
        <div class="aHover">
            <h5> hey &#x1F525;</h5>
        </div>

        <div class="estHover">
            <a href="https://nsi.stefa.org/2ACAPON/cv/cv.html"><h4>Le CV</h4></a>
            <a href="https://nsi.stefa.org/2ACAPON/indices/recherche.html"><h4>Idée UI</h4></a>
            <a href="https://51.210.102.53/2ACAPON/recap-cour/home.html"><h4>Recap des cours</h4></a>
			<a href="https://nsi.stefa.org/2ACAPON/heure/heure.html" ><h4>plus</h4></a>
		</div>

    </main>
</body>
</html>
